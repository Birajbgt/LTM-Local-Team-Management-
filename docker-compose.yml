
services:
  postgres:
    image: postgres:18.6
    container_name: ltm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ltm_db
      POSTGRES_USER: ltm_user
      POSTGRES_PASSWORD: ltm_dev_password
    ports:
      - "5433:5432"
    volumes:
      - ltm_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltm_user -d ltm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ltm_postgres_data:
